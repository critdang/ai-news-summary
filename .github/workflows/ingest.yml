name: Scheduled RSS ingestion

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Ingest configured RSS sources
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.8-flash' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE || 'vi' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || vars.MAX_ARTICLES_PER_SOURCE || '50' }}
          MAX_ARTICLE_RETRIES_PER_RUN: ${{ vars.MAX_ARTICLE_RETRIES_PER_RUN || '25' }}
          MAX_ARTICLES_PER_BATCH: ${{ vars.MAX_ARTICLES_PER_BATCH || '15' }}
          MAX_BATCH_INPUT_CHARS: ${{ vars.MAX_BATCH_INPUT_CHARS || '20000' }}
          MAX_ARTICLE_EXCERPT_CHARS: ${{ vars.MAX_ARTICLE_EXCERPT_CHARS || '1200' }}
          MAX_AI_CALLS_PER_RUN: ${{ vars.MAX_AI_CALLS_PER_RUN || '20' }}
          FEED_FETCH_CONCURRENCY: ${{ vars.FEED_FETCH_CONCURRENCY || '4' }}
          AI_BATCH_CONCURRENCY: ${{ vars.AI_BATCH_CONCURRENCY || '2' }}
          AI_TIMEOUT_MS: "15000"
          AI_MAX_RETRIES: "3"
