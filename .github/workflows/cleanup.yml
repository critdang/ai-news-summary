name: Article retention cleanup

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview eligible rows or apply deletion
        type: choice
        options: [preview, apply]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: article-retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Preview expired unbookmarked articles
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: npm run cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '45' }}
      - name: Apply retention cleanup
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
        run: npm run cleanup -- --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '45' }}
