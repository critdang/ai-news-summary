name: Scheduled RSS ingestion

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rss-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Ingest configured RSS sources
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGESTION_SCHEDULED: ${{ github.event_name == 'schedule' }}
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE || 'vi' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || vars.MAX_ARTICLES_PER_SOURCE || '50' }}
          FEED_FETCH_CONCURRENCY: ${{ vars.FEED_FETCH_CONCURRENCY || '4' }}
